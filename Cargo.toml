[package]
name = "study-garden"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { version = "0.19.1", features = ["dev"] }
bevy_defer = "0.18.0"
bincode-next = "3.1.1"
crossbeam-channel = "0.5.16"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["serde_derive"] }

[workspace]
resolver = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
